name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r docs-site/requirements.txt

      - name: Deploy to GitHub Pages
        run: |
          cd docs-site
          mkdocs gh-deploy --force
