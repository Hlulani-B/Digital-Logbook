name: Tests

on:
  push:
    branches: [hlulani, main]
  pull_request:
    branches: [hlulani, main]

# Allow outsiders to see test results
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ─── Frontend Tests ───
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with JUnit reporter
        working-directory: frontend
        run: npx vitest run --reporter=default --reporter=junit --outputFile=test-results.xml
        env:
          CI: true

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend Tests
          path: frontend/test-results.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results.xml
          retention-days: 30

  # ─── Backend Services Tests ───
  backend-tests:
    name: ${{ matrix.service }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - dashboard-service
          - profile-service
          - project-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run tests with JUnit reporter
        working-directory: services/${{ matrix.service }}
        run: npx jest --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./
          JEST_JUNIT_OUTPUT_NAME: test-results.xml

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: ${{ matrix.service }} Tests
          path: services/${{ matrix.service }}/test-results.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-results
          path: services/${{ matrix.service }}/test-results.xml
          retention-days: 30

  # ─── Test Summary ───
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    if: always()
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-test-results'
          path: test-results

      - name: Generate test summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          
          for dir in test-results/*/; do
            service=$(basename "$dir")
            for xml in "$dir"*.xml; do
              if [ -f "$xml" ]; then
                tests=$(grep -oP 'tests="\K[^"]+' "$xml" | head -1 || echo "?")
                failures=$(grep -oP 'failures="\K[^"]+' "$xml" | head -1 || echo "?")
                errors=$(grep -oP 'errors="\K[^"]+' "$xml" | head -1 || echo "?")
                if [ "$failures" = "0" ] && [ "$errors" = "0" ]; then
                  status="✅ $tests passed"
                else
                  status="❌ $failures failed / $errors errors"
                fi
                echo "| $service | $status |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          done
