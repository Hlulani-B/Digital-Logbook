site_name: Digital Logbook Docs
site_description: Documentation for the COMS3011A Digital Logbook project
repo_url: https://sdp.ms.wits.ac.za/codacaine/Digital-Logbook
repo_name: codacaine/Digital-Logbook

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture:
      - Overview: architecture/overview.md
      - Database Schema: architecture/database.md
      - CI/CD & Deployment: architecture/cicd-deployment.md
      - API Contracts: architecture/api-contracts.md
      - System Design: architecture/system-design.md
      - Tech Stack: architecture/teck-stack.md
      - UI Design: architecture/ui-design.md
  - Roadmap: roadmap.md
  - Development Log: development/log.md
  - Meeting Log: development/meetings.md
  - Sprint 1 User Stories: development/user-stories.md
  - Open Questions & Decisions: development/decisions.md
