name: Frontend Integration Tests

on:
  push:
    branches: [main, hlulani]
  pull_request:
    branches: [main]

jobs:
  frontend-integration-tests:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests with coverage
        run: npx vitest run src/__integration__/ --exclude "**/node_modules/**" "**/dist/**" --coverage --testTimeout=15000 --teardownTimeout=15000 || true

      - name: Fix coverage paths (Windows dedup)
        if: always()
        run: node scripts/fix-coverage.js

      - name: Coverage summary table
        if: always()
        run: node scripts/coverage-summary.js
