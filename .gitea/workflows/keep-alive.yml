name: Keep Render Alive & Supabase Active

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main, hlulani]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint (with retry)
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::error::RENDER_URL secret is not configured — skipping ping"
            exit 0
          fi

          URL="${RENDER_URL}/service/health-ping"
          echo "Pinging: $URL"

          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/health-response.json -w "%{http_code}" --max-time 30 "$URL" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Render instance is awake"
              cat /tmp/health-response.json 2>/dev/null || true
              exit 0
            fi

            if [ "$i" -lt 3 ]; then
              echo "Waiting 15s before retry..."
              sleep 15
            fi
          done

          echo "::warning::All 3 ping attempts failed (last HTTP $HTTP_CODE). Render may still be waking up."
          echo "Response body:"
          cat /tmp/health-response.json 2>/dev/null || echo "(no response)"
          exit 0
