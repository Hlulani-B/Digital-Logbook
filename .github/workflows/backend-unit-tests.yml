name: Backend Unit Tests

on:
  push:
    branches: [main, hlulani]
  pull_request:
    branches: [main, hlulani]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (auth-service)
        run: npm ci
        working-directory: services/auth-service

      - name: Install dependencies (dashboard-service)
        run: npm ci
        working-directory: services/dashboard-service

      - name: Install dependencies (profile-service)
        run: npm ci
        working-directory: services/profile-service

      - name: Install dependencies (project-service)
        run: npm ci
        working-directory: services/project-service

      - name: Run tests with coverage (auth-service)
        run: npm run test:coverage -- --testPathIgnorePatterns="integration" --ci --reporters=default --reporters=jest-junit --forceExit --detectOpenHandles || true
        working-directory: services/auth-service
        env:
          JEST_JUNIT_OUTPUT_DIR: ./
          JEST_JUNIT_OUTPUT_NAME: test-results.xml

      - name: Run tests with coverage (dashboard-service)
        run: npm run test:coverage -- --testPathIgnorePatterns="integration" --ci --reporters=default --reporters=jest-junit --forceExit --detectOpenHandles || true
        working-directory: services/dashboard-service
        env:
          JEST_JUNIT_OUTPUT_DIR: ./
          JEST_JUNIT_OUTPUT_NAME: test-results.xml

      - name: Run tests with coverage (profile-service)
        run: npm run test:coverage -- --testPathIgnorePatterns="integration" --ci --reporters=default --reporters=jest-junit --forceExit --detectOpenHandles || true
        working-directory: services/profile-service
        env:
          JEST_JUNIT_OUTPUT_DIR: ./
          JEST_JUNIT_OUTPUT_NAME: test-results.xml

      - name: Run tests with coverage (project-service)
        run: npm run test:coverage -- --testPathIgnorePatterns="integration" --ci --reporters=default --reporters=jest-junit --forceExit --detectOpenHandles || true
        working-directory: services/project-service
        env:
          JEST_JUNIT_OUTPUT_DIR: ./
          JEST_JUNIT_OUTPUT_NAME: test-results.xml

      - name: Combined backend coverage summary table
        if: always()
        run: node scripts/backend-coverage-summary.js

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Unit Tests
          path: services/*/test-results.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results
          path: services/*/test-results.xml
          retention-days: 30
