name: Continuous Integration (CI) Pipeline

on:
  push:
    branches: [main, hlulani]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Root Dependencies
        run: npm ci

      - name: Check Code Formatting
        run: npm run format:check

      # 1. Frontend
      - name: Install Frontend
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npx oxlint

      - name: Test Frontend
        working-directory: frontend
        run: npm test

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # 2. Auth Service
      - name: Install & Test Auth Service
        working-directory: services/auth-service
        run: |
          npm ci
          npm test

      # 3. Dashboard Service
      - name: Install & Test Dashboard Service
        working-directory: services/dashboard-service
        run: |
          npm ci
          npm test

      # 4. Project Service
      - name: Install & Test Project Service
        working-directory: services/project-service
        run: |
          npm ci
          npm test

      # 5. Profile Service
      - name: Install & Test Profile Service
        working-directory: services/profile-service
        run: |
          npm ci
          npm test
