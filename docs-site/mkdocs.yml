site_name: Digital Logbook Docs
site_description: Documentation for the COMS3011A Digital Logbook project
repo_url: https://sdp.ms.wits.ac.za/codacaine/Digital-Logbook
repo_name: codacaine/Digital-Logbook

theme:
  name: material
  palette:
    - scheme: default
      primary: pink
      accent: rose
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: pink
      accent: rose
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Lora
    code: Fira Code
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/git-alt

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.extra
  - pymdownx.tabbed:
      alternate_style: true
  - md_in_html
  - tables
  - attr_list
  - toc:
      permalink: true
      toc_depth: 3

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Features: features.md
  - Architecture:
      - Overview: architecture/overview.md
      - Database Schema: architecture/database.md
      - CI/CD & Deployment: architecture/cicd-deployment.md
      - API Contracts: architecture/api-contracts.md
      - System Design: architecture/system-design.md
      - Tech Stack: architecture/teck-stack.md
      - UI Design: architecture/ui-design.md
      - Voice Recording: architecture/voice-feature.md
  - Roadmap: roadmap.md
  - Development:
      - Development Log: development/log.md
      - Methodology & Git Workflow: development/methodology.md
      - Meeting Log: development/meetings.md
      - Sprint 1 User Stories: development/user-stories.md
      - Stakeholder Interaction: development/stakeholder-interaction.md
      - Open Questions & Decisions: development/decisions.md
      - Issues & Troubleshooting: development/issues.md
      - AI Attribution: development/ai-attribution.md
