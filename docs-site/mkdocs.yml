site_name: Digital Logbook Docs
site_description: Documentation for the COMS3011A Digital Logbook project
repo_url: https://sdp.ms.wits.ac.za/codacaine/Digital-Logbook
repo_name: codacaine/Digital-Logbook

theme:
  name: material
  palette:
    - scheme: default
      primary: pink
      accent: rose
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: pink
      accent: rose
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Lora
    code: Fira Code
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/git-alt

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.extra
  - pymdownx.tabbed:
      alternate_style: true
  - md_in_html
  - tables
  - attr_list
  - toc:
      permalink: true
      toc_depth: 3

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Features: features.md
  - Architecture:
      - Overview: Architecture/overview.md
      - Database Schema: Architecture/database.md
      - CI/CD & Deployment: Architecture/cicd-deployment.md
      - API Contracts: Architecture/api-contracts.md
      - System Design: Architecture/system-design.md
      - Tech Stack: Architecture/teck-stack.md
      - UI Design: Architecture/ui-design.md
      - Voice Recording: Architecture/voice-feature.md
      - IndexedDB Caching: Architecture/caching.md
      - SSE Real-Time Updates: Architecture/sse.md
      - Keep-Alive Daemons: Architecture/daemon.md
      - Entry Summaries: Architecture/entry-summaries.md
      - UML Architecture Diagrams: Architecture/uml-diagrams.md
      - Third-Party Dependencies: Architecture/third-party.md
  - Roadmap: roadmap.md
  - Meetings:
      - Sprint 1: Meetings/sprint-one-meetings.md
      - Sprint 2: Meetings/sprint-two-meetings.md
  - Stakeholder Interactions:
      - Sprint 1: Stakeholder_Interactions/sprint-one.md
      - Sprint 2: Stakeholder_Interactions/sprint-two.md
  - User Stories:
      - Sprint 1: User_Stories/sprint-one.md
      - Sprint 2: User_Stories/sprint-two.md
  - Project Management:
      - Development Log: Project_Management/log.md
      - Methodology & Git Workflow: Project_Management/methodology.md
      - Work Tracker: Project_Management/work-tracker.md
      - Open Questions & Decisions: Project_Management/decisions.md
      - Issues & Troubleshooting: Project_Management/issues.md
      - AI Attribution: Project_Management/ai-attribution.md
  - Testing:
      - Code Quality Tools: Testing/code-quality.md
      - Testing & User Feedback: Testing/testing.md
