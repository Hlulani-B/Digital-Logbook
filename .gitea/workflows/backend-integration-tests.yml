name: Backend Integration Tests

on:
  push:
    branches: [main, hlulani]
  pull_request:
    branches: [main]

jobs:
  backend-integration-tests:
    name: ${{ matrix.service }} Integration Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - dashboard-service
          - profile-service
          - project-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npx jest --testPathPattern="integration" --forceExit --detectOpenHandles
