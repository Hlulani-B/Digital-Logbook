name: Frontend Integration Tests

on:
  push:
    branches: [main, hlulani]
  pull_request:
    branches: [main, hlulani]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  frontend-integration-tests:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests with JUnit reporter
        run: npx vitest run src/__integration__/ --reporter=default --reporter=junit --outputFile=test-results.xml --testTimeout=15000 --teardownTimeout=15000
        env:
          CI: true

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend Integration Tests
          path: frontend/test-results.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-integration-test-results
          path: frontend/test-results.xml
          retention-days: 30
